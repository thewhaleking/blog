# Production URL. Cloudflare Pages builds with this value as-is (no build-time
# override), so it must match the live site for absolute links/feeds to be
# correct.
baseURL = "https://blog.latent.to/"
locale = "en-us"
title = "Latent Engineering"
theme = "PaperMod"

# Generate a clean RSS/Atom feed alongside HTML.
[outputs]
home = ["HTML", "RSS"]

# Pagination for the post list.
[pagination]
pagerSize = 10

# Taxonomies: built-in tags + a custom `author` taxonomy so every author
# gets an archive page automatically. Rich author profiles live in
# data/authors.yaml, keyed by the same value used in a post's `author` field.
[taxonomies]
tag = "tags"
author = "authors"

[params]
# PaperMod: show the author/tags/reading-time line and enable nicer post UX.
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowToc = true
defaultTheme = "auto"
description = "Engineering notes, deep dives, and war stories from the Latent team."
# Render the home page as the same plain post list as /posts: no home-info
# hero box (its min-height caused large whitespace on desktop) and no
# oversized "first entry" treatment.
disableSpecial1stPost = true

# Favicon files live in static/; source image is 48x48, smaller sizes are
# downscaled from it.
[params.assets]
favicon = "favicon.png"
favicon16x16 = "favicon-16x16.png"
favicon32x32 = "favicon-32x32.png"
apple_touch_icon = "apple-touch-icon.png"

[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "tags"
name = "Tags"
url = "/tags/"
weight = 20

[[menu.main]]
identifier = "authors"
name = "Authors"
url = "/authors/"
weight = 30

[markup.highlight]
noClasses = false
codeFences = true
guessSyntax = true
