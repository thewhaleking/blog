name: Build check

# Validate every PR builds cleanly so a broken post can't be merged.
on:
  pull_request:
    branches: [master]

env:
  HUGO_VERSION: 0.162.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo extended
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build (no deploy)
        env:
          # Authenticates the build-time GitHub profile lookups (author names).
          HUGO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --printPathWarnings surfaces colliding output paths; the build fails
        # on any template/frontmatter error, blocking the PR.
        run: hugo --gc --minify --printPathWarnings
