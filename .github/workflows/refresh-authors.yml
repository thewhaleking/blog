name: Refresh author profiles

# Keeps data/authors.yaml in sync with GitHub profiles (names, avatars, bios).
# The site build never calls the GitHub API — this workflow does, then opens a
# PR with any changes for review. Runs weekly and on demand.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

# Needed for peter-evans/create-pull-request to push a branch and open the PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Refresh data/authors.yaml
        env:
          # Raises the API rate limit; profile lookups are public reads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_authors.py
      - name: Open PR with any changes
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: refresh author profiles"
          title: "chore: refresh author profiles"
          body: |
            Automated refresh of `data/authors.yaml` from GitHub profiles.

            Generated by `scripts/refresh_authors.py` via the **Refresh author
            profiles** workflow. Review the diff and merge if it looks right.
          branch: chore/refresh-authors
          delete-branch: true
          add-paths: data/authors.yaml
