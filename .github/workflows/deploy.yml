name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: # allow manual redeploys from the Actions tab

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.169.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo extended
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive # pull in the PaperMod theme
          fetch-depth: 0 # full history for .GitInfo / .Lastmod if used
      - name: Build
        # Uses baseURL from hugo.toml (https://blog.bdhimes.com/). Do not use
        # the Pages base_url output: it is http:// when "Enforce HTTPS" is off,
        # and browsers then block the absolute image URLs as mixed content.
        run: hugo --gc --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
